# =============================================================================
# KOTODAMA - Unified Docker Compose (Phases 0-9)
# =============================================================================
# Technical Specification v2.0 Final
# All Services: PostgreSQL + PGVector, MinIO, Ollama, FastAPI, Godot, Next.js, Nginx, Redis
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with PGVector extension for Lore RAG
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kotodama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kotodama
      POSTGRES_PASSWORD: kotodama_secret_k8s_key_2026
      POSTGRES_DB: kotodama
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - kotodama-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotodama -d kotodama"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: kotodama-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: kotodama_admin
      MINIO_ROOT_PASSWORD: kotodama_minio_secret_k8s_key_2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    networks:
      - kotodama-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis - Caching and Task Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: kotodama-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kotodama-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama - Local LLM Inference
  # NOTE (ЭТАП 1.3): Закомментировано намеренно.
  # Docker Desktop на Windows плохо пробрасывает AMD iGPU (gfx1151) в контейнеры,
  # что приводит к тихому откату Ollama на CPU (генерация висит часами) или падению.
  # Ollama запускается НАТИВНО в WSL2 (где работает ROCm), а контейнеры обращаются
  # к нему через хост: OLLAMA_BASE_URL=http://host.docker.internal:11434 (см. .env).
  # Команды для нативного режима: `make ollama-pull` и `ollama serve` внутри Ubuntu (WSL2).
  # ---------------------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: kotodama-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #     # Bind mount локального каталога моделей Ollama (чтобы переиспользовать уже скачанные модели)
  #     # Windows + Docker Desktop: раскомментируйте строку ниже и укажите свой путь, например:
  #     # - C:/Users/orlov/.ollama:/root/.ollama
  #   environment:
  #     # AMD RDNA 3.5 (Vulkan) конфигурация для WSL2 / Docker Desktop
  #     AMD_VULKAN_ICD: RADV
  #     HSA_OVERRIDE_GFX_VERSION: "11.0.0"
  #     CUDA_VISIBLE_DEVICES: "-1"
  #     HIP_VISIBLE_DEVICES: "-1"
  #   networks:
  #     - kotodama-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s
  #   # Примечание: блок deploy.resources.reservations.devices (nvidia) удалён —
  #   # он ломает запуск на AMD/CPU-хостах. Для NVIDIA GPU добавьте его обратно при необходимости.

  # ---------------------------------------------------------------------------
  # FastAPI Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: kotodama-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://kotodama:kotodama_secret_k8s_key_2026@postgres:5432/kotodama
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: kotodama_admin
      MINIO_SECRET_KEY: kotodama_minio_secret_k8s_key_2026
      MINIO_BUCKET_ASSETS: kotodama-assets
      MINIO_BUCKET_BUILDS: kotodama-builds
      MINIO_SECURE: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_CODE_MODEL: ${LLM_CODE_MODEL:-qwen2.5-coder:32b}
      LLM_DESIGN_MODEL: ${LLM_DESIGN_MODEL:-qwen2.5:32b}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-nomic-embed-text}
      LOG_LEVEL: INFO
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-kotodama_dev_secret_key_change_in_production}
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,http://nginx:80"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend:ro
      - ./godot_core:/app/godot_core:ro
      - workspace_data:/app/workspace
      - ./configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ollama удалён — LLM работает нативно в WSL2 (см. ЭТАП 1.3),
      # контейнер достучится до него через host.docker.internal:11434
    networks:
      - kotodama-network
    extra_hosts:
      # Для Linux-хостов (и старых Docker Desktop) явная привязка имени хоста
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Godot Headless Worker - Testing and Builds
  # ---------------------------------------------------------------------------
  godot-headless:
    image: barichello/godot-ci:4.3
    container_name: kotodama-godot
    restart: unless-stopped
    volumes:
      - ./godot_core:/godot/core:ro
      - workspace_data:/godot/workspace
      - godot_cache:/root/.local/share/godot
    networks:
      - kotodama-network
    entrypoint: ["sleep", "infinity"]

  # ---------------------------------------------------------------------------
  # Next.js Frontend Service
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: kotodama-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kotodama-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: kotodama-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - kotodama-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  # ollama_data больше не используется — Ollama работает нативно в WSL2 (ЭТАП 1.3)
  # ollama_data:
  #   driver: local
  workspace_data:
    driver: local
  godot_cache:
    driver: local
  nginx_logs:
    driver: local

networks:
  kotodama-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
